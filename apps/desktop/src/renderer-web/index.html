<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss: https:; media-src 'self' blob:"
    />
    <title>Deva</title>
    <!-- 首帧引导：服务端把认证后的同步配置原样注入此数据块（零额外请求、无串行 RTT）。
         type="application/json" 为惰性数据块，不受 CSP script-src 限制；theme-init.js 读取它。 -->
    <script id="deva-boot" type="application/json">{"pending":true}</script>
    <script src="/theme-init.js"></script>
    <style>
      /* 启动闪屏（内联，确保先于样式表加载即刻生效——刷新时也不会看到裸露的应用或登录页） */
      html, body { margin: 0; height: 100%; background: #ffffff; }
      html[data-theme='dark'], html[data-theme='dark'] body { background: #1e1e20; }
      .deva-splash {
        position: fixed; inset: 0; z-index: 10000;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: inherit;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Roboto, Helvetica, Arial, sans-serif;
        transition: opacity 0.4s ease;
      }
      html[data-theme='dark'] .deva-splash { background: #1e1e20; color: #e4e4e7; }
      html:not([data-theme='dark']) .deva-splash { background: #ffffff; color: #1f1f24; }
      .deva-splash.is-gone { opacity: 0; pointer-events: none; }
      .deva-splash__logo { width: 72px; height: 72px; border-radius: 17px; box-shadow: 0 10px 30px rgba(91, 91, 214, 0.35); animation: deva-splash-pop 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
      @keyframes deva-splash-pop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
      .deva-splash__name { font-size: 20px; font-weight: 700; letter-spacing: 0.02em; }
      .deva-splash__spinner {
        width: 26px; height: 26px; border-radius: 50%;
        border: 3px solid rgba(124, 124, 240, 0.25); border-top-color: #7c7cf0;
        animation: deva-spin 0.8s linear infinite;
      }
      @keyframes deva-spin { to { transform: rotate(360deg); } }
      .deva-splash__text { font-size: 13px; opacity: 0.55; min-height: 18px; }
      .deva-splash__retry {
        display: none; align-items: center; gap: 6px; height: 34px; padding: 0 16px;
        border: 1px solid rgba(128, 128, 140, 0.35); border-radius: 8px; background: transparent;
        color: inherit; font-size: 13px; font-family: inherit; cursor: pointer;
      }
      @media (prefers-reduced-motion: reduce) { .deva-splash__spinner { animation-duration: 2s; } .deva-splash__logo { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- 启动闪屏：WS 连接就绪 + React 首帧提交后淡出；断线时重新出现（转圈） -->
    <div class="deva-splash" id="deva-splash">
      <svg class="deva-splash__logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" aria-hidden="true">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4F46E5" />
            <stop offset="1" stop-color="#7C3AED" />
          </linearGradient>
        </defs>
        <rect width="1024" height="1024" rx="224" fill="url(#bg)" />
        <g fill="#FFFFFF" transform="translate(-27 -26)">
          <rect x="312" y="272" width="96" height="380" rx="48" />
          <circle cx="360" cy="756" r="48" />
          <path d="M468 320 H500 A218 218 0 0 1 500 756 H468" fill="none" stroke="#FFFFFF" stroke-width="96" stroke-linejoin="round" />
        </g>
      </svg>
      <div class="deva-splash__name">Deva</div>
      <div class="deva-splash__spinner"></div>
      <div class="deva-splash__text" id="deva-splash-text">正在连接…</div>
      <button class="deva-splash__retry" id="deva-splash-retry" type="button">重新加载</button>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
